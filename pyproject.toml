[project]
name = "quorumdeck"
version = "0.1.0a1"
description = "A terminal console for running several AI agents, on different models and providers, side by side."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pradeep Kumar Balakrishnan", email = "pradeep.devlabs@gmail.com" },
]
keywords = ["llm", "tui", "terminal", "agents", "multi-agent", "litellm", "byom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "litellm>=1.77",
    "textual>=5.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "keyring>=25.0",
]

[project.urls]
Homepage = "https://github.com/pradyb/quorumdeck"
Repository = "https://github.com/pradyb/quorumdeck"
Issues = "https://github.com/pradyb/quorumdeck/issues"

[project.scripts]
deck = "quorumdeck.cli:main"
quorumdeck = "quorumdeck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "textual-dev>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorumdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:quorumdeck.*"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Presentation layers: box-drawing and typographic glyphs are deliberate, and
# Textual's BINDINGS/CSS_PATH class attributes are framework convention.
"src/quorumdeck/tui/*" = ["RUF001", "RUF002", "RUF003", "RUF012"]
"src/quorumdeck/cli.py" = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
source = ["src/quorumdeck"]
omit = ["src/quorumdeck/tui/*"]
