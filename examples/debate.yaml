# Author answers, critic objects, author revises -- for `rounds` rounds.
#
# `rounds: 2` means: draft, critique, revision, critique, revision -- five
# turns, ending on the author's final revision. Each side sees only its own
# thread plus what it is deliberately shown: the critic sees the latest
# draft, the author sees the latest critique, never each other's full history.
#
# On OpenRouter's free tier, so it costs nothing to run:
#
#   deck keys set openrouter        # from https://openrouter.ai/keys
#   deck --config examples/debate.yaml
#
# Free model ids rotate; swap in any live one from
# https://openrouter.ai/models?q=free if one of these is gone.
version: 1

deck:
  pattern: debate
  rounds: 2
  title: Debate

defaults:
  timeout_s: 180

agents:
  - id: author
    name: Author
    model: "openrouter/google/gemma-4-31b-it:free"
    system_prompt: Answer directly. When critiqued, revise rather than defend.
    role: peer

  - id: critic
    name: Critic
    model: "openrouter/nvidia/nemotron-3-super-120b-a12b:free"
    system_prompt: Find the strongest concrete objection. No praise.
    role: critic
