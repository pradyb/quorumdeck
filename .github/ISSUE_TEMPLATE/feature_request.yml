name: Feature request
description: Suggest something agentdeck should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I checked ROADMAP.md and this is not already planned
