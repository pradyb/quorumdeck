# Two agents answer in parallel, then the referee is shown both answers --
# numbered, not named, so it ranks the answers rather than the brands.
version: 1

deck:
  pattern: judge
  judge: referee
  title: Consensus

agents:
  - id: a
    name: Answer A
    model: anthropic/claude-opus-5

  - id: b
    name: Answer B
    model: openai/gpt-5

  - id: referee
    name: Referee
    model: anthropic/claude-opus-5
    system_prompt: Compare the candidate answers and merge the best of each.
    role: judge
